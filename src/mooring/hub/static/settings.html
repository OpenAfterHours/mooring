<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mooring · Settings</title>
  <!-- Apply the theme before first paint (mirrors the hub): last-used theme, else
       the server's inlined default. The theme control on this page writes through
       the same /api/ui/theme path and localStorage key, so an open hub/chat
       re-themes live via a same-origin storage event. -->
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem("mooring.ui.theme") || "__MOORING_DEFAULT_THEME__";
    } catch {
      // localStorage may be unavailable (private mode); the CSS default applies.
    }
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<!-- Settings wears the hub's "chart room": the same rail, the same header block, the
     same hairlines instead of card boxes. It carries `hub-body` so it inherits that
     whole layer rather than restating it, plus `settings-body` for the row rhythm
     that is its own. Two panes, not three — a settings row already carries its
     control on the right, so there is no third thing to put in a detail panel. -->
<body class="hub-body page-body settings-body" data-page="settings">
  <main class="hub-shell">

  <!-- ====================================================================
       RAIL — where you are in the app, and where you are on this page.
       ==================================================================== -->
  <nav class="rail" aria-label="Settings">
    <!-- Brand-as-home: the ⚓ mooring lockup is the way back to the hub (the
         conventional logo-as-home), as it has been on every sub-page. -->
    <a class="rail-brand brand-home" href="/" title="Back to the hub">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6v16M19 13l2-1a9 9 0 0 1-18 0l2 1M9 11h6"/><circle cx="12" cy="4" r="2"/></svg>
      <span class="rail-word">mooring</span>
    </a>

    <!-- The pages any machine can reach. Built by subpage.js from the `data-page`
         attribute on <body>, so the list lives in one place for all three. -->
    <div id="rail-nav" class="rail-nav"></div>

    <!-- The sections of this page. Built by settings.js from the server's group
         list (so a group with nothing in it never gets an entry), and marked
         active by subpage.js's scroll spy. -->
    <div id="section-nav" class="rail-sections"></div>

    <div class="rail-foot">
      <div id="rail-note">saved on this machine only</div>
    </div>
  </nav>

  <!-- ====================================================================
       CENTRE — one sentence about what this page is, then the settings.
       ==================================================================== -->
  <section class="centre">
    <svg class="hub-watermark" viewBox="0 0 24 24" fill="none" stroke="#ff9100" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6v16M19 13l2-1a9 9 0 0 1-18 0l2 1M9 11h6"/><circle cx="12" cy="4" r="2"/></svg>

    <!-- Outside the header block, exactly as on the hub, so a failed save stays on
         screen no matter where you have scrolled to. -->
    <div id="error-banner" class="notice notice-error hidden"></div>

    <div class="centre-head">
      <div id="meta-line" class="meta-line"></div>
      <!-- The headline states the one fact that governs everything below it: these
           are YOUR machine's preferences, not the team's. -->
      <h2 class="headline">Preferences for this machine.</h2>
      <div id="settings-intro" class="page-intro">
        Repositories are managed from the hub&#8217;s repo menu; team-wide and admin
        settings are shown read-only below.
      </div>
    </div>

    <div class="centre-body">
      <div id="settings-root"></div>
    </div>
  </section>

  </main>

  <script src="/static/theme.js"></script>
  <script src="/static/subpage.js"></script>
  <script src="/static/chat_core.js"></script>
  <script src="/static/settings.js"></script>
</body>
</html>
